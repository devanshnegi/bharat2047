name: Update Bharat 2047 Data

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and validate data from Apps Script
        env:
          APPS_SCRIPT_URL: ${{ vars.APPS_SCRIPT_URL }}
        run: |
          set -euo pipefail
          if [ -z "$APPS_SCRIPT_URL" ]; then
            echo "ERROR: Repository variable APPS_SCRIPT_URL is not set." >&2
            echo "Add it under Settings -> Secrets and variables -> Actions -> Variables." >&2
            exit 1
          fi

          BASE_URL="${APPS_SCRIPT_URL%%\?*}"
          FETCH_URL="${BASE_URL}?format=json"

          curl -fsSL --retry 3 --retry-delay 5 --max-time 60 "$FETCH_URL" -o data.tmp.json

          if ! jq -e 'type == "object" and (.gdp | type == "object") and (.gdp.currentT | type == "number") and (.gdp.currentT > 0)' data.tmp.json > /dev/null; then
            echo "ERROR: Invalid payload (missing numeric .gdp.currentT). Keeping existing data.json." >&2
            rm -f data.tmp.json
            exit 1
          fi

          jq '.' data.tmp.json > data.json
          rm -f data.tmp.json

      - name: Commit and push data.json if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "data.json unchanged; skipping commit."
          else
            git commit -m "Update data.json"
            git push
          fi
